<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Painel do Proprietário</title>

    <!-- ========================================================= -->
    <!-- CONFIGURAÇÕES PRINCIPAIS (SUBSTITUA AQUI OS SEUS DADOS)   -->
    <!-- ========================================================= -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBNKkud_RLSoH6nL4hzqp78DFu_6QNc3aQocxOoUzkjF5EEHharwzg8ioJGczNCklEDA/exec";
        const ONESIGNAL_DONO_APP_ID = "fb8aab6d-4c3d-4f20-8e76-7980d0e94a3f";
        const LOGO_PATH = "./logo_nova.jpg";
        const DONO_LOGIN = "dono"; // ID de notificação do proprietário
    </script>
    <!-- ========================================================= -->

    <!-- Configurações PWA e Safe Area -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Painel Dono">
    <link rel="apple-touch-icon" href="./logo_nova.jpg">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: ONESIGNAL_DONO_APP_ID,
          serviceWorkerPath: "sw.js",
          serviceWorkerParam: { scope: "/" },
        });
        await OneSignal.login(DONO_LOGIN);
        await OneSignal.Notifications.requestPermission();
      });
    </script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .safe-padding-top { padding-top: calc(var(--sat) + 1rem); }
        .safe-padding-bottom { padding-bottom: calc(var(--sab) + 1rem); }

        .glass-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center safe-padding-top safe-padding-bottom">

    <div class="w-full max-w-md glass-card rounded-2xl p-6 shadow-2xl border border-white/10 relative">
        
        <!-- CABEÇALHO COM A LOGOTIPO DA EMPRESA -->
        <div class="flex items-center gap-3.5 mb-6 border-b border-white/10 pb-4">
            <div class="p-0.5 rounded-xl bg-gradient-to-b from-emerald-500/30 to-transparent shadow-[0_0_15px_rgba(63,185,80,0.15)] shrink-0">
                <img id="app-logo" src="./logo_nova.jpg" alt="Logo" class="w-12 h-12 rounded-xl object-cover border border-white/10">
            </div>
            <div>
                <h1 class="text-base font-extrabold text-white leading-tight">Painel do Proprietário</h1>
                <p class="text-xs text-gray-400 font-medium">Lançamento de Contas & Faturas</p>
            </div>
            <div class="ml-auto">
                <button type="button" onclick="ativarNotificacoesDono()" class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center active:scale-95 transition-all">
                    <i class="fa-solid fa-bell text-xs"></i>
                </button>
            </div>
        </div>

        <!-- FORMULÁRIO DE ATUALIZAÇÃO DA PLANILHA -->
        <form id="form-gestao" onsubmit="salvarDados(event)" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-gray-300 uppercase mb-1.5">Login do Inquilino</label>
                <input type="text" id="login-inquilino" placeholder="Ex: paulo" required class="w-full bg-[#161b22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <div>
                <label class="block text-[11px] font-bold text-gray-300 uppercase mb-1.5">Identificação do Imóvel</label>
                <input type="text" id="casa-nome" placeholder="Ex: Casa 01" required class="w-full bg-[#161b22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-gray-300 uppercase mb-1.5">Aluguel (R$)</label>
                    <input type="number" step="0.01" id="val-aluguel" placeholder="0.00" class="w-full bg-[#161b22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-300 uppercase mb-1.5">Energia (R$)</label>
                    <input type="number" step="0.01" id="val-energia" placeholder="0.00" class="w-full bg-[#161b22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-gray-300 uppercase mb-1.5">Dia de Vencimento Mensal</label>
                <input type="number" id="dia-vencimento" placeholder="10" value="10" min="1" max="31" class="w-full bg-[#161b22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <button type="submit" id="btn-salvar" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-3.5 rounded-xl active:scale-95 transition-all text-sm flex justify-center items-center gap-2 shadow-lg shadow-emerald-500/20 mt-2">
                <i class="fa-solid fa-paper-plane"></i> Atualizar e Enviar
            </button>
        </form>

        <p id="msg-status" class="text-center text-xs font-semibold mt-4 hidden"></p>
    </div>

    <script>
        // Atualiza dinamicamente o SRC da imagem se alterado no topo
        document.getElementById('app-logo').src = LOGO_PATH;

        async function salvarDados(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            const msg = document.getElementById('msg-status');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Enviando...';
            msg.classList.add('hidden');

            const payload = {
                login: document.getElementById('login-inquilino').value,
                casa: document.getElementById('casa-nome').value,
                aluguel: parseFloat(document.getElementById('val-aluguel').value) || 0,
                energia: parseFloat(document.getElementById('val-energia').value) || 0,
                diaVencimento: parseInt(document.getElementById('dia-vencimento').value) || 10
            };

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.status === 'success') {
                    msg.innerText = "✅ Planilha atualizada e notificação enviada!";
                    msg.className = "text-center text-xs font-semibold mt-4 text-emerald-400 block";
                } else {
                    throw new Error(data.message || "Erro no servidor");
                }
            } catch (err) {
                msg.innerText = "❌ Erro ao atualizar: " + err.message;
                msg.className = "text-center text-xs font-semibold mt-4 text-red-400 block";
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Atualizar e Enviar';
            }
        }

        function ativarNotificacoesDono() {
            if (window.OneSignalDeferred) {
                window.OneSignalDeferred.push(async function(OneSignal) {
                    await OneSignal.login(DONO_LOGIN);
                    await OneSignal.Notifications.requestPermission();
                    alert("Notificações do proprietário ativadas!");
                });
            }
        }
    </script>
</body>
</html>
