<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Painel do </title>

    <!-- ========================================================= -->
    <!-- CONFIGURAÇÕES PRINCIPAIS                                  -->
    <!-- ========================================================= -->
    <script>
        const SHEET_ID = '1b-hPE6fom1F94MDmek3LeWL7g4O4rTlb_ruZjbfer7s';
        const SHEET_NAME = 'casas';
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBNKkud_RLSoH6nL4hzqp78DFu_6QNc3aQocxOoUzkjF5EEHharwzg8ioJGczNCklEDA/exec";
        const ONESIGNAL_DONO_APP_ID = "fb8aab6d-4c3d-4f20-8e76-7980d0e94a3f";
        const LOGO_PATH = "./logo_nova.jpg";
        const DONO_LOGIN = "dono";
    </script>
    <!-- ========================================================= -->

    <!-- Configurações PWA e Safe Area -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Painel Dono">
    <link rel="apple-touch-icon" href="./logo_nova.jpg">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: ONESIGNAL_DONO_APP_ID,
          serviceWorkerPath: "sw.js",
          serviceWorkerParam: { scope: "/" },
        });

        // Vincula a identificação única do proprietário
        await OneSignal.login(DONO_LOGIN);

        // Dispara a solicitação nativa do navegador imediatamente
        try {
            await OneSignal.Notifications.requestPermission();
        } catch (err) {
            console.log("Aguardando interação do usuário para permissão.");
        }
      });
    </script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .safe-padding-top { padding-top: calc(var(--sat) + 1rem); }
        .safe-padding-bottom { padding-bottom: calc(var(--sab) + 1rem); }

        .glass-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center safe-padding-top safe-padding-bottom">

    <div class="w-full max-w-md glass-card rounded-2xl p-6 shadow-2xl border border-white/10 relative">
        
        <!-- CABEÇALHO COM LOGO DA EMPRESA -->
        <div class="flex items-center gap-3.5 mb-6 border-b border-white/10 pb-4">
            <div class="p-0.5 rounded-xl bg-gradient-to-b from-emerald-500/30 to-transparent shadow-[0_0_15px_rgba(63,185,80,0.15)] shrink-0">
                <img id="app-logo" src="./logo_nova.jpg" alt="Logo" class="w-12 h-12 rounded-xl object-cover border border-white/10">
            </div>
            <div>
                <h1 class="text-base font-extrabold text-white leading-tight">Painel do Proprietário</h1>
                <p class="text-xs text-gray-400 font-medium">Lançamento de Faturas & Valores</p>
            </div>
        </div>

        <!-- FORMULÁRIO DE SELEÇÃO E EDIÇÃO -->
        <form id="form-gestao" onsubmit="salvarDados(event)" class="space-y-4">
            
            <!-- SELETOR DE CASAS DA PLANILHA -->
            <div>
                <label class="block text-[11px] font-bold text-gray-300 uppercase mb-1.5 flex justify-between items-center">
                    <span>Selecionar Imóvel</span>
                    <button type="button" onclick="carregarCasasPlanilha()" class="text-emerald-400 hover:underline text-[10px] lowercase font-normal flex items-center gap-1">
                        <i class="fa-solid fa-rotate-right"></i> atualizar lista
                    </button>
                </label>
                <select id="select-casa" onchange="selecionarCasa()" required class="w-full bg-[#161b22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                    <option value="">Carregando imóveis...</option>
                </select>
            </div>

            <!-- DETALHES DO INQUILINO SELECIONADO -->
            <div id="info-inquilino" class="hidden bg-white/5 border border-white/10 rounded-xl p-3 text-xs space-y-1">
                <div class="flex justify-between">
                    <span class="text-gray-400">Inquilino (Login):</span>
                    <span id="disp-login" class="font-bold text-emerald-400">---</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-400">Dia de Vencimento:</span>
                    <span id="disp-vencimento" class="font-bold text-white">Dia 10</span>
                </div>
            </div>

            <!-- VALORES DE ALUGUEL E ENERGIA PARA EDITAR -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[11px] font-bold text-gray-300 uppercase mb-1.5">Aluguel (R$)</label>
                    <input type="number" step="0.01" id="val-aluguel" placeholder="0.00" required class="w-full bg-[#161b22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-300 uppercase mb-1.5">Energia (R$)</label>
                    <input type="number" step="0.01" id="val-energia" placeholder="0.00" required class="w-full bg-[#161b22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
                </div>
            </div>

            <!-- CAMPOS OCULTOS REPASSADOS AUTOMATICAMENTE -->
            <input type="hidden" id="login-inquilino">
            <input type="hidden" id="casa-nome">
            <input type="hidden" id="dia-vencimento" value="10">

            <button type="submit" id="btn-salvar" disabled class="w-full bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-black font-extrabold py-3.5 rounded-xl active:scale-95 transition-all text-sm flex justify-center items-center gap-2 shadow-lg shadow-emerald-500/20 mt-2">
                <i class="fa-solid fa-paper-plane"></i> Salvar e Enviar Notificação
            </button>
        </form>

        <p id="msg-status" class="text-center text-xs font-semibold mt-4 hidden"></p>
    </div>

    <script>
        document.getElementById('app-logo').src = LOGO_PATH;
        let listaCasas = [];

        function parseToNumber(val) {
            if (val === null || val === undefined || val === '') return 0;
            let numStr = val.toString().replace(/[R$\s]/g, '').replace(/\./g, '').replace(',', '.');
            let num = parseFloat(numStr);
            return isNaN(num) ? 0 : num;
        }

        async function carregarCasasPlanilha() {
            const select = document.getElementById('select-casa');
            select.innerHTML = '<option value="">Carregando imóveis...</option>';

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Erro ao acessar a planilha");

                const text = await response.text();
                const json = JSON.parse(text.substring(47, text.length - 2));
                const rows = json.table.rows;

                listaCasas = [];
                select.innerHTML = '<option value="">Selecione um imóvel...</option>';

                rows.forEach((row, index) => {
                    const c = row.c;
                    if (!c) return;

                    const casa = c[0] ? (c[0].v || '') : '';
                    const aluguel = c[1] ? parseToNumber(c[1].v) : 0;
                    const energia = c[2] ? parseToNumber(c[2].v) : 0;
                    const login = c[3] ? (c[3].v || '').toString().trim().toLowerCase() : '';
                    const diaVencimento = c[4] ? parseToNumber(c[4].v) : 10;

                    if (login && casa) {
                        const item = { index, casa, aluguel, energia, login, diaVencimento };
                        listaCasas.push(item);

                        const opt = document.createElement('option');
                        opt.value = login;
                        opt.textContent = `${casa} (${login})`;
                        select.appendChild(opt);
                    }
                });

            } catch (err) {
                console.error(err);
                select.innerHTML = '<option value="">Erro ao carregar imóveis</option>';
            }
        }

        function selecionarCasa() {
            const selectedLogin = document.getElementById('select-casa').value;
            const item = listaCasas.find(c => c.login === selectedLogin);
            const btn = document.getElementById('btn-salvar');
            const info = document.getElementById('info-inquilino');

            if (item) {
                document.getElementById('login-inquilino').value = item.login;
                document.getElementById('casa-nome').value = item.casa;
                document.getElementById('val-aluguel').value = item.aluguel;
                document.getElementById('val-energia').value = item.energia;
                document.getElementById('dia-vencimento').value = item.diaVencimento;

                document.getElementById('disp-login').innerText = item.login;
                document.getElementById('disp-vencimento').innerText = `Todo dia ${item.diaVencimento}`;

                info.classList.remove('hidden');
                btn.disabled = false;
            } else {
                info.classList.add('hidden');
                btn.disabled = true;
            }
        }

        async function salvarDados(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar');
            const msg = document.getElementById('msg-status');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Atualizando...';
            msg.classList.add('hidden');

            const payload = {
                login: document.getElementById('login-inquilino').value,
                casa: document.getElementById('casa-nome').value,
                aluguel: parseFloat(document.getElementById('val-aluguel').value) || 0,
                energia: parseFloat(document.getElementById('val-energia').value) || 0,
                diaVencimento: parseInt(document.getElementById('dia-vencimento').value) || 10
            };

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.status === 'success') {
                    msg.innerText = "✅ Atualizado na planilha e notificação disparada!";
                    msg.className = "text-center text-xs font-semibold mt-4 text-emerald-400 block";
                    carregarCasasPlanilha();
                } else {
                    throw new Error(data.message || "Erro no servidor");
                }
            } catch (err) {
                msg.innerText = "❌ Erro ao atualizar: " + err.message;
                msg.className = "text-center text-xs font-semibold mt-4 text-red-400 block";
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Salvar e Enviar Notificação';
            }
        }

        window.onload = carregarCasasPlanilha;
    </script>
</body>
</html>
